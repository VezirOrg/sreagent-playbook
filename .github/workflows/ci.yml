name: ci
on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scrub check self-test
        run: scripts/scrub-check.sh --self-test
      - name: scrub check (tree; CI has no denylist, the hooks check names locally)
        env:
          SCRUB_ALLOW_NO_DENYLIST: '1'
        run: scripts/scrub-check.sh
      - name: python compiles
        run: |
          files=$(git ls-files '*.py')
          [ -z "$files" ] || python3 -m py_compile $files
      - name: shell syntax
        run: for f in $(git ls-files '*.sh' '.githooks/*'); do sh -n "$f" || bash -n "$f"; done
      - name: perfmon-blackbox local tests (synthetic data)
        run: python3 -m unittest discover -s playbooks/perfmon-blackbox/tests/local -t playbooks/perfmon-blackbox
      - name: sql-mcp local tests L01 L02 L03 (PowerShell 7 on the runner)
        run: for t in L01 L02 L03; do sh playbooks/sql-mcp/tests/run.sh $t || exit 1; done

  sql-mcp-windows:
    # L01 under Windows PowerShell 5.1: the configuration generator as it runs on the MCP host.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: L01 under Windows PowerShell 5.1
        shell: pwsh
        env:
          PWSH: powershell.exe
        run: |
          cd playbooks/sql-mcp
          python -m unittest -v tests.local.test_local.L01DabConfig

  perfmon-blackbox-windows:
    # Pester (L05) and the PSScriptAnalyzer 5.1 rules under Windows PowerShell 5.1, then the package build (T01's
    # build half; authoring side, PowerShell 7). Test-only modules are saved into C:\BbDev on the runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester and lint (Windows PowerShell 5.1)
        shell: powershell
        run: playbooks\perfmon-blackbox\tests\pester\Run-L05.ps1 -Src "$env:GITHUB_WORKSPACE\playbooks\perfmon-blackbox"
      - name: package build
        shell: pwsh
        run: playbooks\perfmon-blackbox\package\build.ps1 -Install -OutputPath "$env:RUNNER_TEMP\pbb"
