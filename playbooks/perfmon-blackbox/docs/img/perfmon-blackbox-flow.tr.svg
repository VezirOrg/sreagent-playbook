<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1600" height="960" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="58" font-size="34" font-weight="700" fill="#0f172a">PerfMon Black Box — uçtan uca döngü</text>
  <text x="40" y="94" font-size="18" fill="#475569">Her Windows sunucuda (Azure VM + Arc) sürekli performans kaydı — Azure Policy dağıtır, makine kendi kimliğiyle yükler, SRE Agent analiz eder.</text>

  <!-- Phase labels -->
  <text x="40" y="150" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1.5">BİR KEZ KURULUM</text>
  <text x="350" y="150" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1.5">SÜREKLİ, OTOMATİK — MAKİNE TARAFI</text>
  <text x="1280" y="150" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1.5">İHTİYAÇ ANINDA</text>
  <line x1="40" y1="160" x2="310" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="350" y1="160" x2="1240" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="1280" y1="160" x2="1560" y2="160" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Box 1: Setup -->
  <rect x="40" y="180" width="270" height="440" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="40" y="180" width="270" height="56" rx="14" fill="#64748b"/>
  <rect x="40" y="220" width="270" height="16" fill="#64748b"/>
  <text x="58" y="215" font-size="19" font-weight="700" fill="#ffffff">① Kurulum</text>
  <g font-size="15" fill="#1e293b">
    <text x="58" y="268" font-weight="700">infra/main.bicep</text>
    <text x="58" y="292">• Private storage</text>
    <text x="58" y="314">  + private endpoint</text>
    <text x="58" y="336">• Shared key kapalı, SAS yok</text>
    <text x="58" y="358">• 2 custom rol</text>
    <text x="58" y="380">  (Writer, Deployer)</text>
    <text x="58" y="418" font-weight="700">4 policy tanımı</text>
    <text x="58" y="442">• VM + Arc, her biri iki modda:</text>
    <text x="58" y="464">• Paket kaynağı tanımda sabit</text>
    <text x="58" y="486">  (GitHub release ya da</text>
    <text x="58" y="508">  kendi container'ınız)</text>
    <text x="58" y="546" font-weight="700">Skill</text>
    <text x="58" y="570">• deploy-skill.sh ile agent'a</text>
    <text x="58" y="592">  (Author + Standard User yeter)</text>
  </g>

  <!-- Box 2: Policy -->
  <rect x="350" y="180" width="270" height="440" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="350" y="180" width="270" height="56" rx="14" fill="#7c3aed"/>
  <rect x="350" y="220" width="270" height="16" fill="#7c3aed"/>
  <text x="368" y="206" font-size="17" font-weight="700" fill="#ffffff">② Azure Policy +</text>
  <text x="368" y="227" font-size="17" font-weight="700" fill="#ffffff">Machine Configuration</text>
  <g font-size="15" fill="#1e293b">
    <text x="368" y="268" font-weight="700">Atama parametreleri</text>
    <text x="368" y="292">• Hedef storage + container</text>
    <text x="368" y="314">• MaxSizeMB = 512</text>
    <text x="368" y="336">• Örnekleme = 10 sn</text>
    <text x="368" y="358">• Export = 4 saatte bir</text>
    <text x="368" y="396" font-weight="700">Makineye ne gider</text>
    <text x="368" y="420">• Guest assignment</text>
    <text x="368" y="442">  "PerfmonBlackbox"</text>
    <text x="368" y="464">• Zip paketi, SHA-256 ile</text>
    <text x="368" y="486">  doğrulanır</text>
    <text x="368" y="508">• 7 DSC kaynağı</text>
    <text x="368" y="546" font-weight="700">Kendini onarır</text>
    <text x="368" y="570">• Sapma olursa ~15 dk içinde</text>
    <text x="368" y="592">  düzeltir, uyumluluk raporlar</text>
  </g>

  <!-- Box 3: Machine -->
  <rect x="660" y="180" width="270" height="440" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <rect x="660" y="180" width="270" height="56" rx="14" fill="#ea580c"/>
  <rect x="660" y="220" width="270" height="16" fill="#ea580c"/>
  <text x="678" y="206" font-size="17" font-weight="700" fill="#ffffff">③ Sunucu</text>
  <text x="678" y="227" font-size="15" fill="#ffffff">Azure VM / Arc (Windows)</text>
  <g font-size="15" fill="#1e293b">
    <text x="678" y="268" font-weight="700">Kayıt (logman)</text>
    <text x="678" y="292">• Dairesel .blg, 512 MB, 10 sn</text>
    <text x="678" y="314">• ~1 gün geriye kayıt hazır</text>
    <text x="678" y="352" font-weight="700">3 zamanlanmış görev</text>
    <text x="678" y="376">• Boot: eskiyi sakla + başlat</text>
    <text x="678" y="398">• Roll: 15 dk'da bir dosyayı</text>
    <text x="678" y="420">  kapat → pending\</text>
    <text x="678" y="442">• Export: 4 saatte bir</text>
    <text x="678" y="464">  relog -q ile yokla</text>
    <text x="678" y="486">  → relog ile birleştir → CSV (UTC)</text>
    <text x="678" y="508">  + manifest (boşluklar) → zip</text>
    <text x="678" y="546" font-weight="700">Kayıp asla sessiz değil</text>
    <text x="678" y="570">• Reboot, saat değişimi, taşma:</text>
    <text x="678" y="592">  manifest'te nedeniyle yazılır</text>
  </g>

  <!-- Box 4: Storage -->
  <rect x="970" y="180" width="270" height="440" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="970" y="180" width="270" height="56" rx="14" fill="#0891b2"/>
  <rect x="970" y="220" width="270" height="16" fill="#0891b2"/>
  <text x="988" y="206" font-size="17" font-weight="700" fill="#ffffff">④ Yükleme +</text>
  <text x="988" y="227" font-size="17" font-weight="700" fill="#ffffff">Private Storage</text>
  <g font-size="15" fill="#1e293b">
    <text x="988" y="268" font-weight="700">Makinenin kendi kimliği</text>
    <text x="988" y="292">• System-assigned MI</text>
    <text x="988" y="314">• VM: IMDS · Arc: HIMDS</text>
    <text x="988" y="336">• Anahtar yok, SAS yok</text>
    <text x="988" y="374" font-weight="700">En az yetki</text>
    <text x="988" y="398">• Yalnızca kendi klasörüne</text>
    <text x="988" y="420">  yazar, kayıtları okuyamaz</text>
    <text x="988" y="458" font-weight="700">Düzen</text>
    <text x="988" y="482">• perfmon/&lt;abonelik&gt;/&lt;rg&gt;/</text>
    <text x="988" y="504">  &lt;sunucu&gt;/yyyy/MM/dd/*.zip</text>
    <text x="988" y="526">• Hata: +5 ve +15 dk'da tekrar,</text>
    <text x="988" y="548">  sonraki export telafi eder</text>
    <text x="988" y="586">• Lifecycle: 30 gün sonra silinir</text>
  </g>

  <!-- Box 5: SRE Agent -->
  <rect x="1280" y="180" width="280" height="440" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="1280" y="180" width="280" height="56" rx="14" fill="#2563eb"/>
  <rect x="1280" y="220" width="280" height="16" fill="#2563eb"/>
  <text x="1298" y="206" font-size="17" font-weight="700" fill="#ffffff">⑤ Azure SRE Agent</text>
  <text x="1298" y="227" font-size="15" fill="#ffffff">skill: perfmon-triage</text>
  <g font-size="15" fill="#1e293b">
    <text x="1298" y="268" font-weight="700">Getir</text>
    <text x="1298" y="292">• En yeni zip'i (ya da bir zaman</text>
    <text x="1298" y="314">  aralığının tüm zip'lerini) indirir</text>
    <text x="1298" y="336">• SHA-256'yı manifest'le doğrular</text>
    <text x="1298" y="374" font-weight="700">Sandbox'ta incele</text>
    <text x="1298" y="398">• CSV → SQLite</text>
    <text x="1298" y="420">• CPU, bellek, disk, ağ,</text>
    <text x="1298" y="442">  süreçler: eşik + trend</text>
    <text x="1298" y="464">• Her "çünkü" bir kanıta bağlı</text>
    <text x="1298" y="502" font-weight="700">Raporla</text>
    <text x="1298" y="526">• Bulgular, kanıt, boşluklar</text>
    <text x="1298" y="548">  thread'e yazılır</text>
    <text x="1298" y="586" fill="#2563eb" font-weight="700">Lab skoru: 95–100 / 100</text>
  </g>

  <!-- Forward arrows -->
  <line x1="312" y1="400" x2="346" y2="400" stroke="#475569" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="622" y1="400" x2="656" y2="400" stroke="#475569" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="932" y1="400" x2="966" y2="400" stroke="#475569" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1242" y1="400" x2="1276" y2="400" stroke="#475569" stroke-width="3" marker-end="url(#ah)"/>

  <!-- Engineer trigger -->
  <rect x="1280" y="680" width="280" height="96" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1298" y="710" font-size="16" font-weight="700" fill="#1e3a8a">👤 Mühendis sorar</text>
  <text x="1298" y="736" font-size="14" fill="#1e293b">"X sunucusunun son PerfMon</text>
  <text x="1298" y="756" font-size="14" fill="#1e293b">kaydını analiz et"</text>
  <line x1="1420" y1="678" x2="1420" y2="624" stroke="#2563eb" stroke-width="3" marker-end="url(#ahb)"/>

  <!-- Return loop -->
  <path d="M 1280 740 L 485 740 L 485 624" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#ahb)"/>
  <rect x="640" y="712" width="480" height="56" rx="10" fill="#f8fafc"/>
  <text x="880" y="736" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Döngü: bulgu → policy atamasında parametre ayarı</text>
  <text x="880" y="758" font-size="14" fill="#334155" text-anchor="middle">(daha sık örnekleme, daha büyük dosya, daha sık export) → yeni kayıt</text>

  <!-- Bottom facts -->
  <rect x="40" y="820" width="1520" height="110" rx="14" fill="#0f172a"/>
  <g font-size="15" fill="#e2e8f0">
    <text x="64" y="854"><tspan font-weight="700" fill="#ffffff">Bizden kurulan yazılım yok:</tspan> yalnızca Machine Configuration (VM eklentisi / Arc agent) ve Windows'un kendi araçları (logman, relog, PowerShell 5.1, .NET).</text>
    <text x="64" y="882"><tspan font-weight="700" fill="#ffffff">Sıfır anahtar:</tspan> yükleme ve agent erişimi managed identity ile (storage modunda paket indirme de); storage private, shared key kapalı, SAS yok.</text>
    <text x="64" y="910"><tspan font-weight="700" fill="#ffffff">Sorun anında geçmiş hazır:</tspan> "o sırada ne oldu?" sorusunun cevabı zaten kayıtta; kötü bir kapanışta en fazla son 15 dk kaybolur, o da raporlanır.</text>
  </g>
</svg>
